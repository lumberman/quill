# Quill configuration — copy to ~/.config/quill/config.toml
# Every key is optional; anything omitted falls back to the built-in default.

# Where edits run. Only "ollama" keeps the text on this machine; the settings
# window always states which. API keys are never stored in this file -- they go
# to the login keyring, or ~/.config/quill/credentials.json at 0600.
#   "ollama"     local, the default
#   "openai"     any OpenAI-compatible server (LM Studio, llama.cpp, vLLM, ...)
#   "codex"      your ChatGPT subscription, via `codex login`
#   "openrouter" cloud, free tier available, via `quill login`
provider = "ollama"

# --- OpenAI-compatible server ----------------------------------------------
# Used when provider = "openai". A key is only needed for non-loopback URLs.
# Pointing this at Ollama works but is slower than the "ollama" provider, which
# can switch reasoning off; this API has no agreed way to do that.
openai_base_url = "http://127.0.0.1:1234/v1"
openai_model = "local-model"

# --- ChatGPT subscription --------------------------------------------------
# Used when provider = "codex". Blank means whatever Codex is configured to use.
codex_model = ""

# --- OpenRouter ------------------------------------------------------------
# Used when provider = "openrouter".
openrouter_model = "z-ai/glm-5.2:free"
openrouter_free_only = true

# --- Ollama ----------------------------------------------------------------
# Any model you have pulled in Ollama. See `ollama list`.
model = "gemma4:12b-it-qat"

host = "http://127.0.0.1:11434"

# How long Ollama keeps the model in VRAM after a request. Longer means the
# next invocation answers instantly; "0" frees the GPU immediately.
keep_alive = "30m"

# Context window. Raise it if you routinely rewrite long passages.
num_ctx = 8192

# Turn off a reasoning model's thinking channel. Keep this false: editing is
# a transformation, not a puzzle, and a thinking model can spend its entire
# context deliberating and return nothing. Omit the key to leave the model's
# own default alone.
think = false

request_timeout = 120.0

# Put the clipboard back the way it was after replacing text.
restore_clipboard = true

# Paste as soon as the model finishes, skipping the review panel.
# Set to false to see the result and confirm before it replaces your text.
auto_replace = true

# --- Actions ---------------------------------------------------------------
# Uncommenting ANY [[actions]] block replaces the whole default menu, so list
# every action you want. Referencing a built-in id and omitting `instruction`
# reuses its built-in prompt, which is handy for reordering or trimming.
#
# [[actions]]
# id = "fix"                       # built-in prompt, renamed and listed first
# label = "Spellcheck"
#
# [[actions]]
# id = "translate_ru"              # a new one of your own
# label = "Translate to Russian"
# instruction = "Translate the text into natural, idiomatic Russian."
# temperature = 0.2
#
# [[actions]]
# id = "custom"
# label = "Custom Instruction…"
# prompts_for_input = true
